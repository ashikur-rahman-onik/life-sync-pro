name: Build APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write # needed to publish the APK as a GitHub Release (used by in-app updates)

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_GITHUB_REPO: ${{ github.repository }}

    steps:
      - name: Check signing secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secret সেট করা নেই। KEYSTORE-SECRETS.txt ফাইলের নির্দেশনা অনুযায়ী Settings → Secrets and variables → Actions এ যোগ করুন।"
            exit 1
          fi

      - uses: actions/checkout@v4

      # Phone-friendly mode: if a project .zip is uploaded at the repo root, it is unpacked and built.
      # (If the project files are uploaded normally, this step does nothing.)
      - name: Unpack project zip (if present)
        run: |
          ZIP=$(ls -t ./*.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP" ]; then
            echo "Unpacking $ZIP"
            rm -rf "$RUNNER_TEMP/proj" && mkdir -p "$RUNNER_TEMP/proj"
            unzip -q "$ZIP" -d "$RUNNER_TEMP/proj"
            ROOT=$(dirname "$(find "$RUNNER_TEMP/proj" -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -n 1)")
            cp -a "$ROOT"/. .
          fi
          test -f package.json || { echo "::error::package.json পাওয়া যায়নি — প্রজেক্ট zip বা ফাইল সঠিকভাবে আপলোড করুন"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The runner already has the Android SDK. Just make sure its licenses are accepted
      # (a failure here is harmless, so it never stops the build).
      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Version numbers
        run: |
          # versionCode = minutes since 1970: always increases, even if the repo is recreated.
          echo "VERSION_CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "VERSION_NAME=${BASE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, test
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build web app
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ env.VERSION_NAME }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/lifesyne-pro.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/lifesyne-pro.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: amardiary
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$APK" || { echo "::error::APK not found"; exit 1; }
          mkdir -p dist-apk
          cp "$APK" dist-apk/lifesyne-pro.apk
          ls -lh dist-apk

      - uses: actions/upload-artifact@v4
        with:
          name: lifesyne-pro-apk
          path: dist-apk/lifesyne-pro.apk
          retention-days: 30

      # The app checks this release to offer "update" without reinstalling.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(git log -1 --pretty=%s)"
          gh release create "b${VERSION_CODE}" dist-apk/lifesyne-pro.apk \
            --title "v${VERSION_NAME}" \
            --notes "${NOTES}" \
            --latest
