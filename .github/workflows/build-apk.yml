name: Build Signed LifeSyne Pro Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Prepare Web Assets & Capacitor 6 Project
        run: |
          rm -rf www android package.json package-lock.json capacitor.config.json
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.lifesync.pro.companion",
            "appName": "LifeSyne Pro",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Configure Official LS Leaf Vector App Icon & Native Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <uses-permission android:name="android.permission.VIBRATE" \/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.WAKE_LOCK" \/>\n    <application/g' "$MANIFEST"

      - name: Ensure Persistent Keystore (No Uninstall Needed on Upgrade)
        run: |
          KEYSTORE_FILE="lifesync-release.keystore"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias lifesync_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass lifesync2026pass \
              -keypass lifesync2026pass \
              -dname "CN=LifeSynePro, OU=Mobile, O=LifeSyne, L=Dhaka, S=BD, C=BD"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$KEYSTORE_FILE"
            git commit -m "chore: save persistent android keystore [skip ci]" || true
            git push || true
          fi
          cp "$KEYSTORE_FILE" android/app/lifesync-release.keystore

      - name: Configure Gradle Signing
        run: |
          VERSION_CODE=${GITHUB_RUN_NUMBER:-1}
          sed -i "s/versionCode 1/versionCode ${VERSION_CODE}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"3.0.${VERSION_CODE}\"/g" android/app/build.gradle

          cat << 'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file('lifesync-release.keystore')
                      storePassword 'lifesync2026pass'
                      keyAlias 'lifesync_key'
                      keyPassword 'lifesync2026pass'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: Build Signed Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../LifeSyne-Pro-Latest.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeSyne-Pro-Signed-APK
          path: LifeSyne-Pro-Latest.apk

      - name: Publish Latest APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: "LifeSyne Pro v3.0.${{ github.run_number }}"
          body: "Automated signed APK build for LifeSyne Pro with Firebase Cloud Sync, Official Logo & Native Mic/Alarm Permissions."
          files: LifeSyne-Pro-Latest.apk
